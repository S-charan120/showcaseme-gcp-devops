services:
  showcaseme-api:
    build: ./api
    environment:
      NODE_ENV: development
      PORT: 8081
      DATABASE_URL: postgres://showcaseme:${DB_PASSWORD:-local-only-change-me}@postgres:5432/showcaseme
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WEB_ORIGIN: http://localhost:8080
      GCS_BUCKET: ${GCS_BUCKET:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8081"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
  web:
    build: ./web
    ports: ["8080:8080"]
    depends_on:
      showcaseme-api:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: showcaseme
      POSTGRES_USER: showcaseme
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcaseme -d showcaseme"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
