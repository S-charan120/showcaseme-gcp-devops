substitutions:
  _REGION: asia-south1
  _REPOSITORY: showcaseme-images
  _API_IMAGE: api
  _WEB_IMAGE: web

steps:
  - id: api-tests
    name: node:22-alpine
    dir: api
    entrypoint: sh
    args:
      - -ceu
      - |
        npm install --no-audit --no-fund
        npm test
        npm run check
  - id: check-existing-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - API_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_API_IMAGE}:$COMMIT_SHA
      - WEB_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:$COMMIT_SHA
    args:
      - -ceu
      - |
        if gcloud artifacts docker images describe "$$API_IMAGE" --format='value(image_summary.digest)' >/dev/null 2>&1; then
          echo "API image already exists for $COMMIT_SHA; skipping immutable tag publication."
          touch /workspace/api-image-exists
        fi
        if gcloud artifacts docker images describe "$$WEB_IMAGE" --format='value(image_summary.digest)' >/dev/null 2>&1; then
          echo "Web image already exists for $COMMIT_SHA; skipping immutable tag publication."
          touch /workspace/web-image-exists
        fi
  - id: build-push-api
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - API_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_API_IMAGE}:$COMMIT_SHA
    args:
      - -ceu
      - |
        if [ -f /workspace/api-image-exists ]; then
          echo "Reusing immutable API image $$API_IMAGE"
        else
          docker build --pull -t "$$API_IMAGE" api
          docker push "$$API_IMAGE"
        fi
  - id: build-push-web
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    env:
      - WEB_IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:$COMMIT_SHA
    args:
      - -ceu
      - |
        if [ -f /workspace/web-image-exists ]; then
          echo "Reusing immutable web image $$WEB_IMAGE"
        else
          docker build --pull -t "$$WEB_IMAGE" web
          docker push "$$WEB_IMAGE"
        fi
  - id: promote-gitops
    name: python:3.12-alpine
    entrypoint: sh
    secretEnv: [GITHUB_TOKEN]
    env:
      - PROMOTED_SHA=$COMMIT_SHA
    args:
      - -ceu
      - |
        apk add --no-cache git
        AUTH_HEADER=$$(printf 'x-access-token:%s' "$$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -c http.extraheader="AUTHORIZATION: basic $$AUTH_HEADER" clone https://github.com/S-charan120/showcaseme-gcp-devops.git /workspace/gitops
        cd /workspace/gitops
        git fetch origin main
        git checkout -B gitops-promotion origin/main
        CURRENT_MAIN_SHA=$$(git rev-parse origin/main)
        if [ "$$PROMOTED_SHA" != "$$CURRENT_MAIN_SHA" ]; then
          echo "Build commit is no longer the current main revision; skipping stale promotion."
          exit 0
        fi
        if ! git merge-base --is-ancestor "$$PROMOTED_SHA" origin/main; then
          echo "Build commit is not in the current main history; skipping promotion."
          exit 0
        fi
        git config user.name "showcaseme-cloudbuild[bot]"
        git config user.email "showcaseme-cloudbuild[bot]@users.noreply.github.com"
        CURRENT_API_SHA=$$(awk '/^api:$/ {found=1; next} /^web:$/ {found=0} found && /^    tag: / {print $$2; exit}' deploy/helm/showcaseme/values-prod.yaml)
        CURRENT_WEB_SHA=$$(awk '/^web:$/ {found=1; next} found && /^    tag: / {print $$2; exit}' deploy/helm/showcaseme/values-prod.yaml)
        test -n "$$CURRENT_API_SHA" && test -n "$$CURRENT_WEB_SHA"
        if [ "$$CURRENT_API_SHA" != "$$CURRENT_WEB_SHA" ]; then
          echo "API and web production image tags are inconsistent; refusing promotion."
          exit 1
        fi
        if [ "$$CURRENT_API_SHA" != "bootstrap" ] && [ "$$CURRENT_API_SHA" != "$$PROMOTED_SHA" ]; then
          if git merge-base --is-ancestor "$$PROMOTED_SHA" "$$CURRENT_API_SHA"; then
            echo "Build $$PROMOTED_SHA is older than the current production image; skipping stale promotion."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$$CURRENT_API_SHA" "$$PROMOTED_SHA"; then
            echo "Promotion history diverged; refusing to overwrite production values."
            exit 1
          fi
        fi
        python -c "import os,re,pathlib; p=pathlib.Path('deploy/helm/showcaseme/values-prod.yaml'); s=p.read_text(); a,b=s.split('web:',1); sha=os.environ['PROMOTED_SHA']; a=re.sub(r'(?m)^(    tag: ).*$',lambda m:m.group(1)+sha,a,count=1); b=re.sub(r'(?m)^(    tag: ).*$',lambda m:m.group(1)+sha,b,count=1); p.write_text(a+'web:'+b)"
        git add deploy/helm/showcaseme/values-prod.yaml
        if git diff --cached --quiet; then echo "No image tag change"; exit 0; fi
        git commit -m "deploy: promote images $$PROMOTED_SHA"
        git -c http.extraheader="AUTHORIZATION: basic $$AUTH_HEADER" push origin HEAD:main
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/showcaseme-github-app-token/versions/latest
      env: GITHUB_TOKEN
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
