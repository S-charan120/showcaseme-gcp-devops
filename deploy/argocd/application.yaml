apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showcaseme
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/S-charan120/showcaseme-gcp-devops.git
    targetRevision: main
    path: deploy/helm/showcaseme
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: showcaseme
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  revisionHistoryLimit: 10
