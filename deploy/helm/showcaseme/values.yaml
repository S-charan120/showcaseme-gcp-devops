namespace: showcaseme

api:
  replicaCount: 2
  image:
    repository: asia-south1-docker.pkg.dev/PROJECT_ID/showcaseme-images/api
    tag: bootstrap
    pullPolicy: IfNotPresent
  service:
    port: 8081
  serviceAccount:
    create: true
    name: showcaseme-api
    gcpServiceAccount: showcaseme-api@PROJECT_ID.iam.gserviceaccount.com
  env:
    NODE_ENV: production
    PORT: "8081"
    GOOGLE_CLOUD_PROJECT: PROJECT_ID
    GCS_BUCKET: PROJECT_ID-showcaseme-assets
  secretName: showcaseme-runtime
  cloudSqlProxy:
    enabled: true
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    connectionName: PROJECT_ID:asia-south1:showcaseme-postgres
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

web:
  replicaCount: 2
  image:
    repository: asia-south1-docker.pkg.dev/PROJECT_ID/showcaseme-images/web
    tag: bootstrap
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

networkPolicy:
  enabled: true

ingress:
  enabled: true
  host: portfolio.example.com
  staticIpName: ""
  managedCertificate: true
  forceHttps: true

