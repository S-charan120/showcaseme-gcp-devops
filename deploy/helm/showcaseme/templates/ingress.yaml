{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: showcaseme
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    {{- if .Values.ingress.managedCertificate }}
    networking.gke.io/managed-certificates: showcaseme-managed-cert
    {{- end }}
    {{- if and .Values.ingress.forceHttps .Values.ingress.managedCertificate }}
    networking.gke.io/v1beta1.FrontendConfig: showcaseme-frontend-config
    {{- end }}
    {{- if .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName | quote }}
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: showcaseme-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
