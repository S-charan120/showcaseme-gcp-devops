apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcaseme-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: showcaseme-api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: showcaseme-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showcaseme-api
      annotations:
        checksum/config: {{ toJson .Values.api.env | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          env:
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.secretName }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- if .Values.api.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.api.cloudSqlProxy.image | quote }}
          args:
            - "--private-ip"
            - "--structured-logs"
            - "--address=127.0.0.1"
            - "--port=5432"
            - {{ .Values.api.cloudSqlProxy.connectionName | quote }}
          resources:
            {{- toYaml .Values.api.cloudSqlProxy.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: showcaseme-api
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: showcaseme-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
